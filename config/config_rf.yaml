model_family: partitioning
features:
  numeric_continuous: [Tenure, WarehouseToHome, HourSpendOnApp, NumberOfDeviceRegistered, NumberOfAddress, OrderAmountHikeFromlastYear, CouponUsed, OrderCount, DaySinceLastOrder, CashbackAmount]
  numeric_binary: [Complain]
  categorical_nominal: [PreferredPaymentMode, PreferedOrderCat, PreferredLoginDevice, MaritalStatus]
  categorical_ordinal: [SatisfactionScore]
protected_attributes: [CityTier, Gender]
imputation_policy:
  numeric:
    - {max_share: 0.10, strategy: median}
    - {max_share: 0.40, strategy: median, add_indicator: true}
    - {max_share: 1.00, strategy: constant, fill_value: 0, add_indicator: true}
  categorical:
    - {max_share: 0.10, strategy: most_frequent}
    - {max_share: 1.00, strategy: constant, fill_value: "Missing"}
transform_policy:
  additive:
    numeric_continuous: [log1p, standard_scaler]
    numeric_binary: [standard_scaler]
    categorical_nominal: [aliases, one_hot]
    categorical_ordinal: [ordinal_encoder, standard_scaler]
  partitioning:
    numeric_continuous: [winsorize]
    numeric_binary: [passthrough]
    categorical_nominal: [aliases, one_hot]
    categorical_ordinal: [ordinal_encoder]